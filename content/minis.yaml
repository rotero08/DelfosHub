# Mini projects: smaller tools and experiments that do not need a site of their own.
# They show in this order.
#
#   id      short lowercase name, used in analytics (mini:<id>)
#   stack   two to four technologies, shown as small tags
#   url     optional public address (a store page, a live demo). Makes the tile a link.
#   repo    optional. The name of the source repository on the GitHub account in site.config.mjs
#           (the name only, never an address). It makes a "Source" link: check that the
#           repository is public first, or the link leads nowhere.
#   status  optional short label, for example where it is published

- id: nihongo-auto-tracker
  name: NihongoAutoTracker
  repo: NihongoAutoTracker
  url: https://addons.mozilla.org/firefox/addon/nihongoautotracker/
  stack: [TypeScript, Svelte, Web APIs]
  status:
    en: Firefox add-on
    es: Extensión de Firefox
  description:
    en: >-
      Browser extension that measures the Japanese video you watch and the text you read,
      and logs it to NihongoTracker for you. No telemetry.
    es: >-
      Extensión de navegador que mide el video que ves y lo que lees en japonés, y lo
      registra en NihongoTracker por ti. Sin telemetría.

- id: geodesic-mapper
  name: Geodesic Mapper
  repo: GeodesicMapper
  stack: [JavaScript, Vite, D3]
  description:
    en: >-
      An interactive globe that morphs into 14 map projections and draws the shortest
      path next to the constant-bearing one. Works with touch.
    es: >-
      Un globo interactivo que se transforma en 14 proyecciones y dibuja la ruta más
      corta junto a la de rumbo constante. Funciona con táctil.

- id: videosubs-whisper
  name: videosubs_whisper
  repo: videosubs_whisper
  stack: [Python, Whisper, FFmpeg]
  description:
    en: >-
      Turns whole folders of video into subtitles in many languages, all on your own
      machine: speech recognition, translation and the final muxed file.
    es: >-
      Convierte carpetas enteras de video en subtítulos en muchos idiomas, todo en tu
      propio equipo: reconocimiento de voz, traducción y el archivo final.

- id: jimaku-subs-stremio
  name: Jimaku Subtitles for Stremio
  repo: jimaku-subs-stremiov2
  stack: [Node.js, Stremio, ASS]
  description:
    en: >-
      A Stremio addon that finds Japanese subtitles from the Jimaku community and turns
      the styled ones into plain SRT on the fly. No dependencies.
    es: >-
      Un addon de Stremio que encuentra subtítulos en japonés de la comunidad Jimaku y
      convierte los que tienen estilos en SRT sencillo al vuelo. Sin dependencias.

- id: voice-spectrum
  name: Voice Spectral Analyzer
  stack: [Python, NumPy, PyQt5]
  description:
    en: >-
      Desktop app that shows live microphone audio as waveform, spectrum and spectrogram,
      with a self-test that measures its own accuracy.
    es: >-
      Aplicación de escritorio que muestra el audio del micrófono como onda, espectro y
      espectrograma, con una autoprueba que mide su propia precisión.

- id: math-music
  name:
    en: Symmetry & Sonority
    es: Simetría y Sonoridad
  repo: SimetriaySonoridad
  stack: [React, Web Audio, SVG]
  description:
    en: >-
      An interactive explorer of pitch-class sets: transpose, invert, walk triads around
      the Tonnetz and see the symmetry, with a piano that sounds in the browser.
    es: >-
      Un explorador interactivo de conjuntos de clases de altura: transpón, invierte,
      recorre tríadas por el Tonnetz y mira la simetría, con un piano que suena en el
      navegador.
