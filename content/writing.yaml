# Writing that you add or adjust by hand.
#
# `pnpm sync` already collects the newest posts of every project that has a `feed` (see
# projects.yaml) into writing.synced.json. Use this file for two things:
#
#   1. Add something the sync cannot see: give it title, url, date, project and lang.
#   2. Improve a synced post: repeat its `url` and add only the fields you want to change.
#      `gloss` is the one-line summary shown to visitors reading the hub in another
#      language than the post; `pinned: true` keeps a post at the top.
#
#   project   the id of a project in projects.yaml (it gives the row its colour and label)
#   lang      the language the post is written in (en, es, ja)

